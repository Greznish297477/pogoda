  if(!S.ach[a.id]&&v>=a.g){S.ach[a.id]=Date.now();save();const rw=R.find(r=>r.a==a.id);toastMsg(`${a.e} Достижение: ${a.t} (+${a.x} XP)${rw?` · 🎁 открыта палитра «${rw.n}»`:""}`);confetti();if(tab==3)renderAch();if(tab==4)renderSet();setTimeout(check,50)}
  else if(!S.ach[a.id]&&a.g>2&&a.g-v==1){S.nu=S.nu||{};if(!S.nu[a.id]){S.nu[a.id]=1;save();toastMsg(`🔥 Остался 1 шаг до «${a.t}»!`)}}})}
function bonus(){const d=new Date().toDateString();if(S.bd==d)return;S.bd=d;S.bx=(S.bx||0)+10;inc("bn");save();toastMsg("🎁 Ежедневный бонус: +10 XP");confetti();renderAch()}
function confetti(){if(!S.anim)return;const cv=$("#cf"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
 const cs=["#ff5c8a","#ffd166","#06d6a0","#4f8cff","#b388ff"],P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,c:cs[Math.random()*5|0],r:Math.random()*6,s:4+Math.random()*5}));let t=0;
 (function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.5);x.restore()});if(++t<120)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})()}
function countUp(){const el=$("#p0 .temp");if(!el||!S.anim)return;const to=parseInt(el.textContent);if(isNaN(to))return;let s0=null;
 const f=ts=>{s0=s0||ts;const k=Math.min(1,(ts-s0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)))+"°";if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function stag(){document.querySelectorAll(".pg.on .card,.pg.on .cell,.pg.on .ach,.pg.on .hr div,.pg.on .day").forEach((e,i)=>e.style.animationDelay=Math.min(i*.035,.7)+"s")}
let tt;function toastMsg(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}

/* ---------- weather fx ---------- */
let fxid;
function fx(code){
 cancelAnimationFrame(fxid);const cv=$("#fx");if(!cv||!S.anim)return;const x=cv.getContext("2d");cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;
 const rain=[51,53,55,61,63,65,80,81,82,95,96,99].includes(code),snow=[71,73,75].includes(code),P=[];
 const n=rain?60:snow?45:code==0||code==1?0:6;
 for(let i=0;i<n;i++)P.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:rain?6+Math.random()*6:snow?.6+Math.random():.3+Math.random()*.4,r:snow?2+Math.random()*3:30+Math.random()*30});
 let t=0;(function f(){t+=.02;x.clearRect(0,0,cv.width,cv.height);const col=getComputedStyle(document.documentElement).getPropertyValue("--opc");x.fillStyle=x.strokeStyle=col;
  if(code==0||code==1){x.globalAlpha=.12;x.translate(cv.width-60,50);x.rotate(t/3);for(let i=0;i<12;i++){x.rotate(Math.PI/6);x.fillRect(-4,60+Math.sin(t*2+i)*8,8,60)}x.setTransform(1,0,0,1,0,0)}
  if(code>=95&&Math.random()<.012){x.globalAlpha=.45;x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.fillStyle=col}x.globalAlpha=.3;P.forEach(p=>{if(rain){x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-2,p.y+12);x.stroke();p.y+=p.s;p.x-=.4}else if(snow){x.beginPath();x.arc(p.x+Math.sin(t+p.y/30)*8,p.y,p.r,0,7);x.fill();p.y+=p.s}else{x.globalAlpha=.08;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();p.x+=p.s;if(p.x>cv.width+60)p.x=-60}
   if(p.y>cv.height){p.y=-10;p.x=Math.random()*cv.width}});x.globalAlpha=1;fxid=requestAnimationFrame(f)})();
}

/* ---------- map ---------- */
const isDark=()=>S.theme=="amoled"||S.theme=="dark"||(S.theme=="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
let M=null,baseL=null,baseDark=null,meM=null,gridG=null,gtok=0,mapOn=false,layer=S.ml||"radar",rvData=null,rvLayers=[],rvIdx=0,rvTimer=null,mapKey="",gT=0,pk=null,pkMoved=false;
const LAYERS=[["radar","🌧️ Осадки"],["temp","🌡️ Температура"],["wind","💨 Ветер"],["cloud","☁️ Облачность"]];
const sheet=()=>$("#mapSheet");
function loadLeaflet(){return new Promise((ok,no)=>{if(window.L)return ok();const c=document.createElement("link");c.rel="stylesheet";c.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(c);const j=document.createElement("script");j.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";j.onload=ok;j.onerror=no;document.head.appendChild(j)})}
async function openMap(){
 if(mapOn)return;mapOn=true;sheet().classList.remove("drag");sheet().style.transform="";sheet().classList.add("open");inc("map");save();check();
 try{await loadLeaflet()}catch(e){toastMsg("Карта недоступна: нет связи");return}
 initMap();setTimeout(()=>M&&M.invalidateSize(),400);
}
function closeMap(){mapOn=false;stopPlay();sheet().classList.remove("open","drag");sheet().style.transform=""}
function mapOpen(){return mapOn}
function initMap(){
 const la=+S.city.la,lo=+S.city.lo,key=la+","+lo;
 if(!M){
  M=L.map("mapEl",{zoomControl:false,attributionControl:true,minZoom:3,maxZoom:12}).setView([la,lo],6);
  gridG=L.layerGroup().addTo(M);
  M.attributionControl.setPrefix(false);
  M.on("moveend",()=>{clearTimeout(gT);gT=setTimeout(gridUpdate,600)});
  $("#chs").innerHTML=LAYERS.map(([k,l])=>`<button data-k="${k}" onclick="setLayer('${k}')">${l}</button>`).join("");
 }else if(key!=mapKey)M.setView([la,lo],6);
 mapKey=key;
 const dk=isDark();
 if(baseDark!==dk){if(baseL)M.removeLayer(baseL);baseDark=dk;baseL=L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dk?"dark_all":"light_all"}/{z}/{x}/{y}{r}.png`,{subdomains:"abcd",maxZoom:12,attribution:"© OpenStreetMap, © CARTO"}).addTo(M);baseL.bringToBack()}
 if(meM)M.removeLayer(meM);meM=L.marker([la,lo],{icon:L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false,zIndexOffset:900}).addTo(M);
 setLayer(layer);
}
function mapLoc(){if(!M)return;M.setView([+S.city.la,+S.city.lo],7)}
function setLayer(k){
 layer=k;S.ml=k;stopPlay();rvLayers.forEach(l=>M.removeLayer(l));rvLayers=[];gridG.clearLayers();gtok++;
 S.st.lay=S.st.lay||[];if(!S.st.lay.includes(k))S.st.lay.push(k);save();check();
 document.querySelectorAll("#chs button").forEach(b=>b.classList.toggle("on",b.dataset.k==k));
 $("#mapBar").style.display=k=="radar"?"flex":"none";
 if(k=="radar")radarInit();else gridUpdate();
}
async function radarInit(){
 try{if(!rvData||Date.now()-rvData.t>3e5){const j=await jget("https://api.rainviewer.com/public/weather-maps.json"),past=(j.radar&&j.radar.past)||[];rvData={t:Date.now(),host:j.host,fr:[...past,...((j.radar&&j.radar.nowcast)||[])],np:past.length-1}}}catch(e){toastMsg("Радар недоступен");return}
 if(layer!="radar"||!rvData.fr.length)return;
 rvLayers=rvData.fr.map(f=>L.tileLayer(`${rvData.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:0,maxNativeZoom:7,maxZoom:12,zIndex:5}).addTo(M));
 $("#mrange").max=rvData.fr.length-1;showFrame(Math.max(0,rvData.np));
}
function showFrame(i){if(!rvData||!rvLayers.length)return;rvIdx=i;rvLayers.forEach((l,j)=>l.setOpacity(j==i?.72:0));const f=rvData.fr[i],d=new Date(f.time*1000);$("#mtime").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+(i==rvData.np?" · сейчас":i>rvData.np?" · прогноз":"");$("#mrange").value=i}
function stopPlay(){clearInterval(rvTimer);rvTimer=null;const b=$("#mplay");if(b)b.textContent="▶"}
function togglePlay(){if(rvTimer)return stopPlay();if(!rvLayers.length)return;$("#mplay").textContent="⏸";rvTimer=setInterval(()=>showFrame((rvIdx+1)%rvLayers.length),650)}
const tcol=t=>`hsl(${Math.round(Math.max(0,Math.min(240,240-(t+30)/70*240)))},75%,48%)`;
const nlon=x=>(((x+540)%360)+360)%360-180;
async function gridUpdate(){
 if(!M||!mapOn||layer=="radar")return;
 const b=M.getBounds(),n=6,m=7,la=[],lo=[],tok=++gtok;
 for(let i=0;i<m;i++)for(let j=0;j<n;j++){la.push(Math.max(-85,Math.min(85,b.getSouth()+(b.getNorth()-b.getSouth())*(i+.5)/m)).toFixed(2));lo.push(nlon(b.getWest()+(b.getEast()-b.getWest())*(j+.5)/n).toFixed(2))}
 try{
  const r=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,wind_speed_10m,wind_direction_10m,cloud_cover`);
  if(tok!=gtok||layer=="radar")return;
  gridG.clearLayers();
  (Array.isArray(r)?r:[r]).forEach((x,i)=>{const c=x.current;if(!c)return;let h,sz;
   if(layer=="temp"){h=`<div class="mk" style="background:${tcol(c.temperature_2m)}">${T(c.temperature_2m)}</div>`;sz=[46,22]}
   else if(layer=="wind"){h=`<div class="wd"><b style="transform:rotate(${(c.wind_direction_10m+180)%360}deg)">↑</b>${WS(c.wind_speed_10m)}</div>`;sz=[78,26]}
   else{h=`<div class="mk" style="background:rgba(70,90,130,${(.3+c.cloud_cover/100*.65).toFixed(2)})">☁️ ${Math.round(c.cloud_cover)}%</div>`;sz=[62,22]}
   L.marker([+la[i],+lo[i]],{icon:L.divIcon({className:"",html:h,iconSize:sz,iconAnchor:[sz[0]/2,sz[1]/2]}),interactive:false}).addTo(gridG)});
 }catch(e){if(tok==gtok)toastMsg("Не удалось загрузить данные карты")}
}
/* жест «потянуть вверх» как в Яндекс Картах */
function pkS(e){pk={y:e.touches[0].clientY,dy:0};pkMoved=false;const el=sheet();el.classList.add("drag");el.style.transform=`translateY(${innerHeight}px)`}
function pkM(e){if(!pk)return;pk.dy=Math.min(0,e.touches[0].clientY-pk.y);if(pk.dy<-6)pkMoved=true;sheet().style.transform=`translateY(${innerHeight+pk.dy}px)`}
function pkE(){if(!pk)return;const d=pk.dy;pk=null;const el=sheet();el.classList.remove("drag");el.style.transform="";if(d<-70){pkMoved=true;openMap()}else setTimeout(()=>pkMoved=false,50)}
let msw=null;
$("main").addEventListener("touchstart",e=>{const m=$("main");msw={y:e.touches[0].clientY,end:m.scrollTop+m.clientHeight>=m.scrollHeight-4}},{passive:true});
$("main").addEventListener("touchend",e=>{if(!msw||tab!=0)return;const dy=e.changedTouches[0].clientY-msw.y,a=msw.end;msw=null;if(a&&dy<-90)openMap()},{passive:true});

/* ---------- nav & boot ---------- */
const TABS=[["🏠","Сегодня"],["📅","Прогноз"],["🏙️","Города"],["🏆","Награды"],["⚙️","Настройки"]];
$("#nav").innerHTML=TABS.map((t,i)=>`<button onclick="go(${i})"><i>${t[0]}</i>${t[1]}</button>`).join("");
function go(i){tab=i;document.querySelectorAll(".pg").forEach((p,j)=>p.classList.toggle("on",i==j));document.querySelectorAll("nav button").forEach((b,j)=>b.classList.toggle("on",i==j));
 if(!S.st.tabs.includes(i))S.st.tabs.push(i);if(i==1)inc("fc");save();render();$("main").scrollTop=0;check()}
function render(){if(!W)return;[renderToday,renderWeek,renderCities,renderAch,renderSet][tab]();stag()}
setInterval(()=>{if(S.rb&&S.anim)palette(1)},400);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",palette);
const td=new Date().toDateString();if(!S.st.days.includes(td))S.st.days.push(td);{const n0=new Date(),hh=n0.getHours(),mi=n0.getMinutes();if(hh<5)S.st.owl=1;if(hh>=5&&hh<8)S.st.early=1;if(hh==12)S.st.noon=1;if((hh==23&&mi>=55)||(hh==0&&mi<=5))S.st.mid=1;if((n0.getMonth()==11&&n0.getDate()==31)||(n0.getMonth()==0&&n0.getDate()==1))S.st.ny=1}
setInterval(()=>load(),600000);
palette();go(0);load();inc("opens");if(S.auto)geo(1);check();
</script>
